; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32@7.0.1
board = upesy_wroom
framework = espidf
monitor_speed = 115200

; OTA requires a partition table with otadata + ota_0 + ota_1
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults

; Replace values for your Wi-Fi and GitHub firmware URL.
; Example URL: https://github.com/<owner>/<repo>/releases/latest/download/firmware.bin
build_flags =
	-D WIFI_SSID=\"YOUR_WIFI_SSID\"
	-D WIFI_PASS=\"YOUR_WIFI_PASSWORD\"
	-D FIRMWARE_URL=\"https://github.com/gametimesav/ota/releases/latest/download/firmware.bin\"
