name: Compile ESPHome and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers compilation every time you commit code to the main branch
  workflow_dispatch: # Allows you to manually trigger this build from the GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ESPHome
        run: |
          pip install esphome

      # Compiles your config file into a binary. Replace 'config.yaml' with your actual file name.
      - name: Compile ESPHome Firmware
        run: |
          esphome compile config.yaml

      # Sets up the target folder structure for GitHub Pages deployment
      - name: Prepare Public Directory Assets
        run: |
          mkdir -p public/firmware
          
          # Extracts the compiled binary file and moves it to your public folder
          cp .esphome/build/*/.pioenvs/*/firmware.bin public/firmware/firmware.bin
          
          # Automatically parses your config file to extract the project version string
          # and saves it cleanly into version.txt so the ESP32 can read it
          grep -A 2 "project:" config.yaml | grep "version:" | awk -F'"' '{print $2}' > public/firmware/version.txt

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
